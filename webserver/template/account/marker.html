{{ define "marker" }}
<td>{{ .Point1.X }}</td>
<td>{{ .Point1.Z }}</td>
<td>{{ .Point2.X }}</td>
<td>{{ .Point2.Z }}</td>
<td>{{ .Color }}</td>
<td style="display: flex; flex-direction: row;">{{ range .Users}}
	<img src="https://klara.kesuaheli.de/render/face/{{.UUID}}" width="32" title="{{.Nicknames}}">{{ end }}
	<form id="add_user_to_marker" hx-patch="?edit=add_user_to_marker&id={{.ID}}" hx-ext="jsonBody" hx-trigger="submit" hx-target="closest tr">
		<input type="number" name="id">			
		<input type="submit" class="likeabutton saveBtn" value="+">
	</form>
</td>
{{ end }}

{{ define "marker.html" }}{{ template "marker" . }}{{ end }}
