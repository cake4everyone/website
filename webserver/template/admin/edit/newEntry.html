{{ define "newEntry" }}
<form hx-patch="/admin?edit=new_entry" hx-ext="jsonBody" hx-trigger="submit" hx-target="closest div.newEntry">

	<label for="fname">Name:</label>
	<input type="text" id="fname" name="name" placeholder="Name"><br>
	<label for="fnick">Nicknames:</label>
	<input type="text" id="fnick" name="nicknames" placeholder="Nickname..."><br>
	<label for="fmc">Minecraft:</label>
	<input type="text" id="fmc" name="minecraft" placeholder="Minecraft Name"><br>
	<label for="frefid">Reference ID:</label>
	<input type="number" id="frefid" name="reference_id" placeholder="Reference"><br>
	<label for="factive">Active:</label>
	<input type="checkbox" id="factive" name="active" value="true"><br>
	
	<input type="submit" class="saveBtn" value="Save">
</form>
<span hx-get="/admin?new_entry" hx-target="closest div.newEntry">Cancel</span>
{{ end }}

{{ define "newEntry.html"}}{{template "newEntry" . }}{{end}}
